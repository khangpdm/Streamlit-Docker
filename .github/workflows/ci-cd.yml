name: CI/CD Pipeline for Docker Swarm

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME}}
          password: ${{ secrets.DOCKER_PASSWORD}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME}}/my-streamlit-app:latest

      - name: Deploy to DockerSwarm via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST}}
          username: ${{ secrets.SSH_USER}}
          password: ${{ secrets.SSH_PASSWORD}}
          script: |
            docker service update --image ${{ secrets.DOCKER_USERNAME}}/my-streamlit-app:latest my-app_streamlit-app
          
