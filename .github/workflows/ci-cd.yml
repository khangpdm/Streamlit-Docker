name: CI/CD Pipeline for Docker Swarm

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-streamlit-app:latest

      - name: Update Docker Swarm Service
        run: |
          docker service update --image ${{ secrets.DOCKER_USERNAME }}/my-streamlit-app:latest my-app_streamlit-app
