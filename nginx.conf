upstream streamlit_cluster {
    # Dùng ip_hash để ép các request từ cùng 1 trình duyệt luôn đi vào đúng 1 container replica
    ip_hash;
    
    server streamlit-app:8501;
}

server {
    listen 80;

    client_max_body_size 500M; # Cho phép upload file ảnh lớn

    location / {
        proxy_pass http://streamlit_cluster;
        
        # Cấu hình chuyển tiếp WebSocket quan trọng cho Streamlit
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Tăng timeout cho các tác vụ xử lý nặng (như nhận diện ảnh/model AI)
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}